<!DOCTYPE html>
<html>
<head>
<title>Connexion wifi</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
body { margin: 0; padding: 20px; text-align: center; color: #fff;
       font-family: "Segoe UI", Arial, sans-serif; background: #000; }
a { color: #ffd23f; }
</style>
<script language="JavaScript">
    // Page servie par le routeur apres un POST de connexion reussi.
    // Elle ne sert qu'a confirmer : le formulaire est deja affiche dans login.html.
    function confirmer() {
        $(if popup == 'true')
        open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
        $(endif)
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ wifi: 'connecte', user: "$(username)", mac: "$(mac)" }, '*');
            }
        } catch (e) { }
        document.getElementById('msg').innerHTML =
            'Connexion etablie.<br><br><a href="$(link-redirect)">Continuer a naviguer</a>';
    }
</script>
</head>
<body onLoad="confirmer()">
<p id="msg">Connexion etablie.</p>
</body>
</html>
